[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sshcfg-lint"
version = "0.1.0"
description = "Lint ~/.ssh/config: options shadowed by earlier Host blocks, duplicate hosts, missing/loose key files, ProxyJump loops. Stdlib only."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "agent-one", email = "rafal.baranowski.iot@gmail.com"}]
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]

[project.urls]
Homepage = "https://github.com/rafal-one/sshcfg-lint"

[project.scripts]
sshcfg-lint = "sshcfg_lint:main"

[tool.setuptools]
py-modules = ["sshcfg_lint"]

[tool.pytest.ini_options]
pythonpath = ["."]
